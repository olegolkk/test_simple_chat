<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с аутентификацией</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Формы авторизации */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .auth-box h2 {
            margin-bottom: 30px;
            color: #2c3e50;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }

        .switch-form a {
            color: #3498db;
            text-decoration: none;
            cursor: pointer;
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Чат */
        .chat-container {
            display: none;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
        }

        .sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .user-info {
            padding: 20px;
            background: #34495e;
        }

        .user-info h3 {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .username {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
            width: 100%;
        }

        .rooms-section {
            flex: 1;
            padding: 20px;
        }

        .room-item {
            padding: 10px;
            margin-bottom: 8px;
            background: #34495e;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .room-item:hover, .room-item.active {
            background: #3498db;
        }

        .users-list {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #3e5a6f;
        }

        .users-list h3 {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .user-item {
            padding: 6px 10px;
            margin-bottom: 4px;
            background: #34495e;
            border-radius: 4px;
            font-size: 12px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .chat-header h2 {
            color: #2c3e50;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.system {
            text-align: center;
            color: #7f8c8d;
            font-size: 12px;
            font-style: italic;
        }

        .message-header {
            font-size: 12px;
            margin-bottom: 4px;
        }

        .message-sender {
            font-weight: bold;
            color: #3498db;
        }

        .message-time {
            color: #95a5a6;
            margin-left: 8px;
        }

        .message-content {
            background: white;
            padding: 8px 12px;
            border-radius: 12px;
            display: inline-block;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.own {
            text-align: right;
        }

        .message.own .message-content {
            background: #3498db;
            color: white;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #3498db;
        }

        .input-area button {
            padding: 12px 24px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .input-area button:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        .status {
            padding: 8px 20px;
            background: #ecf0f1;
            font-size: 12px;
            color: #2c3e50;
            border-top: 1px solid #ddd;
        }

        .online-count {
            font-size: 11px;
            color: #1abc9c;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Форма авторизации -->
    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <h2>Вход в чат</h2>
            <div id="authError" class="error-message" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>

            <div class="switch-form">
                Нет аккаунта? <a onclick="showRegister()">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <!-- Форма регистрации -->
    <div id="registerContainer" class="auth-container" style="display: none;">
        <div class="auth-box">
            <h2>Регистрация</h2>
            <div id="registerError" class="error-message" style="display: none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="regUsername" placeholder="Имя пользователя" required>
                </div>
                <div class="form-group">
                    <input type="email" id="regEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" placeholder="Пароль" required>
                </div>
                <div class="form-group">
                    <input type="password" id="regConfirmPassword" placeholder="Подтвердите пароль" required>
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>

            <div class="switch-form">
                Уже есть аккаунт? <a onclick="showLogin()">Войти</a>
            </div>
        </div>
    </div>

    <!-- Чат -->
    <div id="chatContainer" class="chat-container">
        <div class="sidebar">
            <div class="user-info">
                <h3>Пользователь</h3>
                <div class="username" id="username"></div>
                <div class="online-count" id="onlineCount">👥 0 онлайн</div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            <div class="rooms-section">
                <h3>Комнаты</h3>
                <div class="room-item active" data-room="general"># general</div>
                <div class="room-item" data-room="random"># random</div>
                <div class="room-item" data-room="tech"># tech</div>

                <div class="users-list">
                    <h3>Пользователи онлайн</h3>
                    <div id="usersList">Загрузка...</div>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h2 id="currentRoom">general</h2>
            </div>

            <div class="messages-area" id="messages">
                <div class="message system">
                    <div class="message-content">Добро пожаловать в чат!</div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Введите сообщение...">
                <button id="sendBtn">Отправить</button>
            </div>

            <div class="status" id="status">🟡 Подключение...</div>
        </div>
    </div>

    <script>
        let ws = null;
        let token = null;
        let currentUser = null;
        let currentRoom = 'general';

        // DOM элементы
        const authContainer = document.getElementById('authContainer');
        const registerContainer = document.getElementById('registerContainer');
        const chatContainer = document.getElementById('chatContainer');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');
        const usersListDiv = document.getElementById('usersList');
        const usernameSpan = document.getElementById('username');
        const onlineCountSpan = document.getElementById('onlineCount');

        // Показ форм
        function showLogin() {
            authContainer.style.display = 'flex';
            registerContainer.style.display = 'none';
        }

        function showRegister() {
            authContainer.style.display = 'none';
            registerContainer.style.display = 'flex';
        }

        // Обработка входа
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.access_token;
                    currentUser = data.user;
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    initChat();
                } else {
                    showError('authError', data.detail || 'Ошибка входа');
                }
            } catch (error) {
                showError('authError', 'Ошибка подключения к серверу');
            }
        });

        // Обработка регистрации
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                showError('registerError', 'Пароли не совпадают');
                return;
            }

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, email, password})
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.access_token;
                    currentUser = data.user;
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    initChat();
                } else {
                    showError('registerError', data.detail || 'Ошибка регистрации');
                }
            } catch (error) {
                showError('registerError', 'Ошибка подключения к серверу');
            }
        });

        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // Инициализация чата
        function initChat() {
            authContainer.style.display = 'none';
            registerContainer.style.display = 'none';
            chatContainer.style.display = 'flex';
            usernameSpan.textContent = currentUser.username;

            connectWebSocket();

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            document.querySelectorAll('.room-item').forEach(item => {
                item.addEventListener('click', () => changeRoom(item.dataset.room));
            });
        }

        // Подключение WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${window.location.host}/ws/${currentRoom}?token=${token}`;

            if (ws) {
                ws.close();
            }

            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log('WebSocket connected');
                statusDiv.innerHTML = '✅ Подключен к чату';
                statusDiv.style.background = '#d4edda';
                statusDiv.style.color = '#155724';
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                statusDiv.innerHTML = '❌ Отключен. Переподключение...';
                statusDiv.style.background = '#f8d7da';
                statusDiv.style.color = '#721c24';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Обработка сообщений
        function handleMessage(message) {
            switch(message.type) {
                case 'system':
                    addSystemMessage(message.content);
                    break;
                case 'chat':
                    addChatMessage(message.client_id, message.content, message.timestamp);
                    break;
                case 'users_list':
                    updateUsersList(message.users);
                    break;
            }
        }

        function addChatMessage(sender, content, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender === currentUser.username ? 'own' : ''}`;
            const time = timestamp ? new Date(timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
            const senderName = sender === currentUser.username ? 'Вы' : escapeHtml(sender);

            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="message-sender">${senderName}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.innerHTML = `<div class="message-content">📢 ${escapeHtml(content)}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ type: 'chat', content: content }));
            messageInput.value = '';
        }

        function updateUsersList(users) {
            if (!usersListDiv) return;

            onlineCountSpan.textContent = `👥 ${users.length} онлайн`;

            if (users.length === 0) {
                usersListDiv.innerHTML = '<div style="color: #95a5a6;">Нет пользователей</div>';
                return;
            }

            usersListDiv.innerHTML = '';
            users.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                userItem.innerHTML = user === currentUser.username ?
                    `👤 ${escapeHtml(user)} (Вы)` :
                    `👤 ${escapeHtml(user)}`;
                usersListDiv.appendChild(userItem);
            });
        }

        function changeRoom(room) {
            if (room === currentRoom) return;

            currentRoom = room;
            document.getElementById('currentRoom').textContent = room;

            // Очищаем сообщения
            messagesDiv.innerHTML = '';
            addSystemMessage(`Переход в комнату ${room}...`);

            // Переподключаемся к новой комнате
            if (ws) ws.close();
            setTimeout(connectWebSocket, 100);

            // Обновляем активную комнату в UI
            document.querySelectorAll('.room-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.room === room) {
                    item.classList.add('active');
                }
            });
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            if (ws) ws.close();
            location.reload();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Проверка сохраненной сессии
        const savedToken = localStorage.getItem('token');
        const savedUser = localStorage.getItem('user');
        if (savedToken && savedUser) {
            token = savedToken;
            currentUser = JSON.parse(savedUser);
            initChat();
        }
    </script>
</body>
</html>
